{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}WebPortfolio Admin{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/dashboard1.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="logo">WebPortfolio Admin</div>
        <div class="hamburger" id="hamburger">&#9776;</div>
    </header>

    <div class="sidebar" id="sidebar">
        <a href="{% url 'dashboard' %}" class="{% if request.path == '/dashboard/' %}active{% endif %}">
            <i class="fa-solid fa-gauge"></i> Dashboard
        </a>
        <a href="{% url 'manage-projects' %}"><i class="fa-solid fa-briefcase"></i> Manage Projects</a>
        <a href="{% url 'manage-resume' %}"><i class="fa-solid fa-file"></i> Manage Resume</a>
        <a href="{% url 'manage-about' %}"><i class="fa-solid fa-user"></i> Manage About</a>
        <a href="{% url 'manage-profile' %}"><i class="fa-solid fa-id-card"></i> Manage Profile</a>
        <a href="{% url 'manage-contact' %}"><i class="fa-solid fa-envelope"></i> Manage Contact</a>
        <a href="{% url 'logout' %}"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </div>

    <div class="main-content">
        {% block content %}
        {% endblock %}
    </div>

    <script src="{% static 'js/dashboard.js' %}"></script>
</body>
</html>
